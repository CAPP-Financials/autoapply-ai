title = "AutoApply.AI gitleaks config"

[allowlist]
description = "Local stub env with placeholder secrets is safe to commit"
paths = [
  '''\.env\.example$''',
  '''\.env\.local$''',
  '''README\.md$''',
]

[[rules]]
id = "anthropic-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
tags = ["key"]

[[rules]]
id = "openai-key"
description = "OpenAI API key"
regex = '''sk-[A-Za-z0-9]{20,}'''
tags = ["key"]

[[rules]]
id = "google-genai-key"
description = "Google Generative AI key"
regex = '''AIza[0-9A-Za-z_-]{35}'''
tags = ["key"]
