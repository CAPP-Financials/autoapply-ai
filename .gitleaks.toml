title = "AutoApply.AI gitleaks config"

[allowlist]
description = "Placeholder secrets in examples and test fixtures are safe to commit"
paths = [
  '''\.env\.example$''',
  '''README\.md$''',
]
# Self-documenting non-secrets: CI stub creds and test fixtures that spell out
# they aren't real. Keeps the full-history scan strict on everything else.
regexes = [
  '''not-a-real-key''',
  '''replace-me''',
  '''ci-secret''',
  '''ci-keyenc''',
]

[[rules]]
id = "anthropic-key"
description = "Anthropic API key"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
tags = ["key"]

[[rules]]
id = "openai-key"
description = "OpenAI API key"
regex = '''sk-[A-Za-z0-9]{20,}'''
tags = ["key"]

[[rules]]
id = "google-genai-key"
description = "Google Generative AI key"
regex = '''AIza[0-9A-Za-z_-]{35}'''
tags = ["key"]
